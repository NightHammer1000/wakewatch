[package]
name = "wakewatch"
version = "0.1.0"
edition = "2024"
description = "Tray indicator for Windows display/standby wakelocks"

[dependencies]
tray-icon = "0.24"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_Security", # CreateMutexW takes SECURITY_ATTRIBUTES
] }

# No build-dependencies: the manifest is embedded via linker flags in build.rs.

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
