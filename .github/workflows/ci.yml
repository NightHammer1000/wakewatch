name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    # Windows-only by design: the whole crate is Win32/NT API.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The tray/timer tests touch the window station. Runners provide one,
        # but surface the reason clearly if that ever changes.
        run: cargo test --all-targets

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $crate = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $crate) {
            throw "tag v$tag does not match Cargo.toml version $crate - bump Cargo.toml or retag"
          }
          Write-Output "tag and Cargo.toml agree on $crate"

      - name: Build release
        run: cargo build --release

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/wakewatch.exe dist/
          $hash = (Get-FileHash dist/wakewatch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  wakewatch.exe" | Out-File -Encoding ascii dist/wakewatch.exe.sha256
          Write-Output "sha256: $hash"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: wakewatch-x86_64-pc-windows-msvc
          path: dist/
          if-no-files-found: error

  release:
    # Only for version tags; a push to main just builds.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wakewatch-x86_64-pc-windows-msvc
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WakeWatch $GITHUB_REF_NAME" \
            --generate-notes
